<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerDrop – Shipments</title>
  <link rel="icon" href="img/favicon/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="styles/app.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="img/my-logo-cropped.svg" alt="PeerDrop"/> PeerDrop
  </div>
  <div class="navbar-menu">
    <a href="dashboard.html" class="hide-mobile">Dashboard</a>
    <a href="trips.html" class="hide-mobile">Trips</a>
    <a href="shipments.html" class="active hide-mobile">Shipments</a>
    <a href="wallet.html" class="hide-mobile">Wallet</a>
    <div class="navbar-avatar" id="avatarInitial">U</div>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="page-wrap">
  <h2 style="margin-bottom:1.25rem" id="pageTitle">Shipments</h2>

  <div class="tabs" id="statusTabs">
    <button class="tab-btn active" onclick="filterStatus('all',event)">All</button>
    <button class="tab-btn" onclick="filterStatus('pending',event)">Pending</button>
    <button class="tab-btn" onclick="filterStatus('accepted',event)">Accepted</button>
    <button class="tab-btn" onclick="filterStatus('picked_up',event)">Picked Up</button>
    <button class="tab-btn" onclick="filterStatus('delivered',event)">Delivered</button>
    <button class="tab-btn" onclick="filterStatus('completed',event)">Completed</button>
  </div>

  <div id="shipmentsContainer">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>

<!-- Shipment Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box" style="max-width:580px">
    <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    <div class="modal-title" id="detailTitle">Shipment Detail</div>
    <div class="steps-track" id="progressTrack" style="margin-bottom:1rem"></div>
    <div id="detailBody" style="font-size:.875rem;color:var(--gray-700);display:flex;flex-direction:column;gap:.5rem"></div>
    <div id="detailActions" style="margin-top:1.25rem;display:flex;gap:.6rem;flex-wrap:wrap"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
  // Global state
  window.allShipments   = [];
  window.currentFilter  = 'all';
  window.currentShipment = null;
  window.currentUser    = null;

  function logout()           { localStorage.clear(); window.location.href = 'login.html'; }
  function openModal(id)      { document.getElementById(id).classList.add('open'); }
  function closeModal(id)     { document.getElementById(id).classList.remove('open'); }

  function filterStatus(s, e) {
    window.currentFilter = s;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (e && e.target) e.target.classList.add('active');
    renderShipments();
  }

  const STEPS       = ['pending','accepted','picked_up','delivered','completed'];
  const STEP_LABELS = ['Requested','Accepted','Picked Up','Delivered','Completed'];

  function stepIdx(status) { return STEPS.indexOf(status); }

  function buildProgressTrack(status) {
    const idx = stepIdx(status);
    return STEPS.map((s, i) => {
      const isDone   = i < idx;
      const isActive = i === idx;
      return `
        <div class="step">
          <div class="step-dot ${isDone?'done':''} ${isActive?'active':''}">
            ${isDone ? '✓' : i+1}
          </div>
          <div class="step-label ${isActive?'active':''}">${STEP_LABELS[i]}</div>
        </div>
        ${i < STEPS.length-1 ? `<div class="step-line ${isDone?'done':''}"></div>` : ''}`;
    }).join('');
  }

  function formatAmt(p) { return `₹${(p/100).toFixed(2)}`; }
  function travelIcon(m){ return {flight:'✈️',train:'🚆',bus:'🚌',car:'🚗',bike:'🏍️'}[m]||'🚀'; }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[character]);
  }

  function showToast(msg, type='info') {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`; t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  window.renderShipments = function() {
    const user = window.currentUser;
    const list = window.currentFilter === 'all'
      ? window.allShipments
      : window.allShipments.filter(s => s.status === window.currentFilter);

    const el = document.getElementById('shipmentsContainer');
    if (!list.length) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>${user && user.role==='traveller' ? 'No incoming requests yet' : 'No shipments here'}</p>
      </div>`;
      return;
    }

    el.innerHTML = list.map(s => `
      <div class="shipment-item" onclick="openDetail('${s.id}')" style="cursor:pointer">
        <div class="shipment-header">
          <div>
            <div class="shipment-route">${s.from} → ${s.to}</div>
            <div class="text-muted text-sm">${travelIcon(s.meansOfTravel)} ${s.meansOfTravel} · 📅 ${s.departureDate || ''}</div>
          </div>
          <div style="text-align:right">
            <span class="badge badge-${s.status}">${s.status.replace(/_/g,' ')}</span>
            ${s.paymentStatus ? `<br><span class="badge badge-${s.paymentStatus}" style="margin-top:3px">${s.paymentStatus}</span>` : ''}
          </div>
        </div>
        <div class="shipment-details">
          <span>📦 ${s.parcelDescription}</span>
          <span>⚖️ ${s.weightKg} kg</span>
          <span>💰 ${formatAmt(s.totalAmount)}</span>
          ${user && user.role==='traveller'
            ? `<span>👤 ${s.senderName||'—'}</span>`
            : `<span>✈️ ${s.travellerName||'—'}</span>`}
        </div>
        ${s.status==='accepted' && s.paymentStatus==='unpaid' && user && user.role==='sender'
          ? `<div style="margin-top:.5rem">
               <a href="payment.html?shipmentId=${s.id}" class="btn btn-accent btn-sm" onclick="event.stopPropagation()">
                 💳 Pay Now ${formatAmt(s.totalAmount)}
               </a>
             </div>` : ''}
        ${s.status==='pending' && user && user.role==='traveller'
          ? `<div style="margin-top:.5rem;display:flex;gap:.5rem">
               <button class="btn btn-accent btn-sm" onclick="event.stopPropagation();quickAccept('${s.id}')">✅ Accept</button>
               <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();quickReject('${s.id}')">❌ Reject</button>
             </div>` : ''}
      </div>`).join('');
  };
</script>

<script type="module">
  import { api, getUser, getToken, timeAgo } from './js/api.js';

  const user = getUser();
  if (!user || !getToken()) { window.location.href = 'login.html'; }

  window.currentUser = user;
  document.getElementById('avatarInitial').textContent = (user.fullName||'U')[0].toUpperCase();
  document.getElementById('pageTitle').textContent =
    user.role === 'traveller' ? 'Incoming Shipment Requests' : 'My Shipments';

  // ── Load shipments ────────────────────────────────────────────────────────
  async function loadShipments() {
    document.getElementById('shipmentsContainer').innerHTML =
      '<div class="loader"><div class="spinner"></div></div>';
    try {
      const data = await api.getMyShipments();
      window.allShipments = data;
      renderShipments();
    } catch (err) {
      document.getElementById('shipmentsContainer').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <p style="color:var(--danger);font-size:.85rem">${err.message}</p>
          <button class="btn btn-ghost btn-sm" style="margin-top:.5rem"
            onclick="window.loadShipments()">🔄 Retry</button>
        </div>`;
    }
  }
  window.loadShipments = loadShipments;

  // ── Open detail modal ─────────────────────────────────────────────────────
  window.openDetail = function(id) {
    const s = window.allShipments.find(x => x.id === id);
    if (!s) return;
    window.currentShipment = s;

    document.getElementById('detailTitle').textContent = `${s.from} → ${s.to}`;
    document.getElementById('progressTrack').innerHTML = buildProgressTrack(s.status);

    document.getElementById('detailBody').innerHTML = `
      <div><strong>Parcel:</strong> ${s.parcelDescription}</div>
      <div><strong>Weight:</strong> ${s.weightKg} kg</div>
      <div><strong>Amount:</strong> ${formatAmt(s.totalAmount)}</div>
      <div><strong>Pickup Spot:</strong> ${s.pickupSpot}</div>
      <div><strong>Delivery Address:</strong> ${s.deliveryAddress}</div>
      ${s.receiverPhone ? `<div><strong>Receiver Phone:</strong> ${s.receiverPhone}</div>` : ''}
      <div><strong>Declared value:</strong> ₹${Number(s.declaredValue || 0).toLocaleString('en-IN')} · Insurance not provided</div>
      <div><strong>Seal serial:</strong> ${escapeHtml(s.sealNumber || 'Not recorded')}</div>
      ${s.pickupPhotoURL ? `<div><strong>Pickup handover photo:</strong></div><img src="${s.pickupPhotoURL}" alt="Sealed parcel at pickup" style="max-width:100%;border-radius:8px"/>` : ''}
      ${s.pickupLocation ? `<div><strong>Pickup GPS:</strong> <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${s.pickupLocation.latitude}&mlon=${s.pickupLocation.longitude}">${s.pickupLocation.latitude.toFixed(5)}, ${s.pickupLocation.longitude.toFixed(5)} (±${Math.round(s.pickupLocation.accuracy)} m)</a></div>` : ''}
      ${s.deliveryLocation ? `<div><strong>Delivery GPS:</strong> <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${s.deliveryLocation.latitude}&mlon=${s.deliveryLocation.longitude}">${s.deliveryLocation.latitude.toFixed(5)}, ${s.deliveryLocation.longitude.toFixed(5)} (±${Math.round(s.deliveryLocation.accuracy)} m)</a></div>` : ''}
      ${user.role==='traveller'
        ? `<div><strong>Sender:</strong> ${s.senderName} · ${s.senderPhone||'—'}</div>`
        : `<div><strong>Traveller:</strong> ${s.travellerName} · ${s.travellerPhone||'—'}</div>`}
      <div><strong>Payment:</strong> <span class="badge badge-${s.paymentStatus}">${s.paymentStatus}</span></div>
      ${s.escrowStatus ? `<div><strong>Escrow:</strong> <span style="color:var(--accent);font-weight:600">${s.escrowStatus}</span></div>` : ''}
      ${s.deliveryPhotoURL && !s.deliveryPhotoURL.startsWith('storage-unavailable')
        ? `<div><strong>Delivery Photo:</strong></div>
           <img src="${s.deliveryPhotoURL}" alt="Delivery proof"
             style="max-width:100%;border-radius:8px;border:2px solid var(--accent);margin-top:.25rem"/>`
        : s.deliveryPhotoURL
          ? `<div><strong>Delivery Photo:</strong> <span style="color:var(--gray-400)">received (preview unavailable)</span></div>`
          : ''}
      <div><strong>Created:</strong> ${new Date(s.createdAt).toLocaleString()}</div>`;

    // Action buttons
    const actEl = document.getElementById('detailActions');
    actEl.innerHTML = '';

    if (user.role === 'traveller') {
      if (s.status === 'pending') {
        actEl.innerHTML = `
          <button class="btn btn-accent" onclick="respond('accept')">✅ Accept</button>
          <button class="btn btn-danger" onclick="respond('reject')">❌ Reject</button>`;
      } else if (s.status === 'accepted' && s.paymentStatus === 'paid') {
        actEl.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:.65rem;width:100%">
            <div style="font-size:.85rem;color:var(--gray-700)">Ask the sender for the pickup OTP only when they hand over the sealed parcel.</div>
            <label>Sender's 6-digit pickup OTP<input type="text" id="pickupOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required/></label>
            <label>Seal serial number<input type="text" id="pickupSealNumber" minlength="3" maxlength="50" required/></label>
            <label>Take pickup photo<input type="file" id="pickupPhotoInput" accept="image/jpeg,image/png,image/webp" capture="environment" required/></label>
            <button class="btn btn-primary" onclick="markPickup()">📦 Verify &amp; Record Pickup</button>
          </div>`;
      } else if (s.status === 'picked_up') {
        actEl.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:.75rem;width:100%">
            <div style="font-size:.85rem;color:var(--gray-700);font-weight:600">
              Receiver verifies the intact seal and shares the OTP only after receiving the parcel. Share GPS updates while in transit.
            </div>
            <label>Receiver's 6-digit delivery OTP<input type="text" id="deliveryOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required/></label>
            <label>Confirm seal serial number<input type="text" id="deliverySealNumber" minlength="3" maxlength="50" required/></label>
            <label>Take delivery photo<input type="file" id="deliveryPhotoInput" accept="image/jpeg,image/png,image/webp" capture="environment" required/></label>
            <button class="btn btn-ghost" onclick="shareShipmentLocation()">📍 Share current GPS with sender</button>
            <button class="btn btn-accent" id="uploadPhotoBtn" onclick="uploadDeliveryPhoto()">
              📸 Verify Receiver &amp; Complete Delivery
            </button>
            <div id="photoUploadProgress" style="display:none;font-size:.8rem;color:var(--gray-400)">
              Capturing GPS and uploading evidence…
            </div>
          </div>`;
      } else if (s.status === 'accepted' && s.paymentStatus === 'unpaid') {
        actEl.innerHTML = `<div style="color:var(--warn);font-size:.85rem;font-weight:600">⏳ Waiting for sender to complete payment</div>`;
      }
    } else {
      // Sender
      if (s.status === 'accepted' && s.paymentStatus === 'unpaid') {
        actEl.innerHTML = `
          <a href="payment.html?shipmentId=${s.id}" class="btn btn-accent btn-lg">
            💳 Pay ${formatAmt(s.totalAmount)} via UPI
          </a>`;
      } else if (s.status === 'accepted' && s.paymentStatus === 'paid') {
        actEl.innerHTML = `<div style="display:flex;flex-direction:column;gap:.5rem">
          <div style="font-size:.85rem">Generate a one-time pickup code and share it directly with the traveller at handover.</div>
          <button class="btn btn-primary" onclick="generateHandoverCode('pickup')">🔐 Generate Pickup OTP</button>
        </div>`;
      } else if (s.status === 'picked_up' && s.paymentStatus === 'paid') {
        actEl.innerHTML = `<div style="display:flex;flex-direction:column;gap:.5rem">
          <div style="font-size:.85rem">Give the delivery code to the receiver only when the sealed parcel is physically handed over. Share it privately; SMS is not configured.</div>
          <button class="btn btn-primary" onclick="generateHandoverCode('delivery')">🔐 Generate Receiver OTP</button>
        </div>`;
      } else if (s.status === 'delivered' && s.paymentStatus === 'paid') {
        // Show delivery photo if available
        const photoHtml = s.deliveryPhotoURL && !s.deliveryPhotoURL.startsWith('storage-unavailable')
          ? `<div style="margin-bottom:.75rem">
               <div style="font-size:.8rem;font-weight:600;color:var(--gray-600);margin-bottom:.35rem">📸 Delivery Photo from Traveller:</div>
               <img src="${s.deliveryPhotoURL}" alt="Delivery proof" style="max-width:100%;border-radius:8px;border:2px solid var(--accent)"/>
             </div>`
          : s.deliveryPhotoURL
            ? `<div style="font-size:.8rem;color:var(--gray-400);margin-bottom:.5rem">📸 Delivery photo received (preview unavailable)</div>`
            : '';
        actEl.innerHTML = `
          ${photoHtml}
          <button class="btn btn-primary" onclick="confirmDelivery()">✅ Confirm Delivery Received</button>`;
      } else if (s.status === 'pending') {
        actEl.innerHTML = `<div style="color:var(--gray-400);font-size:.85rem">⏳ Waiting for traveller to accept</div>`;
      }
    }

    openModal('detailModal');
    if (s.status === 'picked_up' && user.role === 'sender') {
      api.getShipmentLocations(s.id).then(points => {
        if (!points.length || window.currentShipment?.id !== s.id) return;
        const latest = points[0];
        const history = document.createElement('div');
        history.innerHTML = `<strong>Latest shared GPS:</strong> <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${latest.latitude}&mlon=${latest.longitude}">${latest.latitude.toFixed(5)}, ${latest.longitude.toFixed(5)} (±${Math.round(latest.accuracy)} m)</a> · ${new Date(latest.recordedAt).toLocaleString()}`;
        document.getElementById('detailBody').appendChild(history);
      }).catch(err => showToast(`Could not load shared locations: ${err.message}`, 'error'));
    }
  };

  // ── Quick accept/reject from list ─────────────────────────────────────────
  window.quickAccept = async function(id) {
    try {
      await api.respondShipment(id, 'accept');
      showToast('Request accepted!', 'success');
      loadShipments();
    } catch(err) { showToast(err.message, 'error'); }
  };

  window.quickReject = async function(id) {
    if (!confirm('Reject this request?')) return;
    try {
      await api.respondShipment(id, 'reject');
      showToast('Request rejected', 'info');
      loadShipments();
    } catch(err) { showToast(err.message, 'error'); }
  };

  // ── Modal actions ─────────────────────────────────────────────────────────
  window.respond = async function(action) {
    const s = window.currentShipment;
    try {
      await api.respondShipment(s.id, action);
      closeModal('detailModal');
      showToast(`Shipment ${action==='accept'?'accepted':'rejected'}`,
                action==='accept'?'success':'info');
      loadShipments();
    } catch(err) { showToast(err.message, 'error'); }
  };

  // ── Mark Picked Up ────────────────────────────────────────────────────────
  window.markPickup = async function() {
    const s = window.currentShipment;
    try {
      const input = document.getElementById('pickupPhotoInput');
      const file = input && input.files && input.files[0];
      if (!file) { showToast('Take a pickup photo first', 'error'); return; }
      if (file.size > 10 * 1024 * 1024) { showToast('Photo must be under 10 MB', 'error'); return; }
      const location = await getPreciseLocation();
      const photoBase64 = await readPhoto(file);
      await api.markPickup(s.id, {
        otp: document.getElementById('pickupOtp').value.trim(),
        sealNumber: document.getElementById('pickupSealNumber').value.trim(),
        photoBase64,
        mimeType: file.type,
        location,
      });
      closeModal('detailModal');
      showToast('Pickup OTP, seal, photo and GPS verified. 📦', 'success');
      loadShipments();
    } catch(err) { showToast(err.message, 'error'); }
  };

  // ── Upload Delivery Photo ─────────────────────────────────────────────────
  window.uploadDeliveryPhoto = async function() {
    const s      = window.currentShipment;
    const input  = document.getElementById('deliveryPhotoInput');
    const btn    = document.getElementById('uploadPhotoBtn');
    const prog   = document.getElementById('photoUploadProgress');

    if (!input || !input.files || !input.files[0]) {
      showToast('Please select a photo first', 'error'); return;
    }

    const file = input.files[0];
    if (file.size > 10 * 1024 * 1024) {
      showToast('Photo must be under 10 MB', 'error'); return;
    }
    const otp = document.getElementById('deliveryOtp').value.trim();
    const sealNumber = document.getElementById('deliverySealNumber').value.trim();
    if (!/^\d{6}$/.test(otp)) { showToast('Enter the receiver’s 6-digit OTP', 'error'); return; }

    btn.disabled = true;
    prog.style.display = '';
    prog.textContent   = 'Capturing GPS and uploading delivery evidence…';

    try {
      const [photoBase64, location] = await Promise.all([readPhoto(file), getPreciseLocation()]);
      await api.uploadDeliveryPhoto(s.id, {
        otp, sealNumber, photoBase64, mimeType: file.type, location,
      });
      closeModal('detailModal');
      showToast('Receiver OTP, seal, photo and GPS recorded. Waiting for sender confirmation. 📸', 'success');
      loadShipments();
    } catch(err) {
      btn.disabled       = false;
      prog.style.display = 'none';
      showToast(err.message || 'Upload failed. Try again.', 'error');
    }
  };

  function readPhoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('Could not read the selected photo'));
      reader.readAsDataURL(file);
    });
  }

  function getPreciseLocation() {
    if (!navigator.geolocation) return Promise.reject(new Error('This device does not support GPS location'));
    return new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(
      position => resolve({
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
      }),
      error => reject(new Error(error.code === 1 ? 'Allow location permission to record handover evidence' : 'Could not get GPS. Try again outdoors.')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    ));
  }

  window.generateHandoverCode = async function(purpose) {
    const s = window.currentShipment;
    try {
      const result = purpose === 'pickup'
        ? await api.generatePickupCode(s.id)
        : await api.generateDeliveryCode(s.id);
      alert(`${purpose === 'pickup' ? 'Pickup' : 'Receiver delivery'} OTP: ${result.code}\n\nExpires in 30 minutes. Share this code privately with the person receiving the parcel. SMS is not configured.`);
    } catch (err) { showToast(err.message, 'error'); }
  };

  window.shareShipmentLocation = async function() {
    const s = window.currentShipment;
    try {
      const location = await getPreciseLocation();
      await api.shareShipmentLocation(s.id, location);
      showToast('Current GPS shared with the sender', 'success');
    } catch (err) { showToast(err.message, 'error'); }
  };

  window.confirmDelivery = async function() {
    const s = window.currentShipment;
    try {
      await api.confirmDelivery(s.id);
      closeModal('detailModal');
      showToast('Delivery confirmed! Traveller wallet credited. ✅', 'success');
      loadShipments();
    } catch(err) { showToast(err.message, 'error'); }
  };

  // ── Init ──────────────────────────────────────────────────────────────────
  loadShipments();

  // Show success toast if returning from payment
  if (new URLSearchParams(location.search).get('paid')) {
    setTimeout(() => showToast('Payment received! Traveller will pick up your parcel. 🎉', 'success'), 500);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerDrop – Secure Payment</title>
  <link rel="icon" href="img/favicon/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="styles/app.css"/>
  <!-- Cashfree JS SDK (sandbox + production auto-select) -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    body { background:#f0f4f8; }
    .pay-wrap  { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .pay-card  { background:#fff; border-radius:16px; box-shadow:0 8px 40px rgba(0,0,0,.13); width:100%; max-width:460px; overflow:hidden; }
    .pay-header{ background:linear-gradient(135deg,var(--primary),#0d6898); color:#fff; padding:1.5rem; }
    .pay-header .merchant { font-size:.8rem; opacity:.8; margin-bottom:4px; }
    .pay-header .amount   { font-size:2.2rem; font-weight:800; }
    .pay-header .desc     { font-size:.85rem; opacity:.8; margin-top:4px; }
    .pay-body  { padding:1.5rem; }
    .shipment-info { background:var(--gray-100); border-radius:10px; padding:.85rem 1rem; font-size:.875rem; color:var(--gray-700); margin-bottom:1.25rem; display:flex; flex-direction:column; gap:.35rem; }
    .cf-drop   { min-height:60px; margin-bottom:1rem; }
    .secure-badge { display:flex; align-items:center; justify-content:center; gap:6px; font-size:.75rem; color:var(--gray-400); margin-top:1rem; }
    .success-box { text-align:center; padding:1.5rem 0; }
    .success-icon { font-size:4rem; margin-bottom:.75rem; }
  </style>
</head>
<body>

<div class="pay-wrap">
  <div class="pay-card">
    <div class="pay-header">
      <div class="merchant">🔒 PeerDrop Secure Checkout</div>
      <div class="amount" id="payAmount">Loading…</div>
      <div class="desc"   id="payDesc">Shipment payment</div>
    </div>

    <div class="pay-body" id="payBody">
      <!-- Shipment summary -->
      <div class="shipment-info" id="shipmentInfo" style="display:none">
        <div><strong id="infoRoute">—</strong></div>
        <div>📦 <span id="infoParcel">—</span></div>
        <div>✈️ Traveller: <span id="infoTraveller">—</span></div>
        <div>📍 Pickup: <span id="infoPickup">—</span></div>
      </div>

      <!-- Cashfree UPI drop element renders here -->
      <div id="cashfreeContainer" class="cf-drop"></div>

      <!-- Loading state -->
      <div id="loadingState" class="loader" style="margin:1.5rem 0">
        <div class="spinner"></div>
        <p style="text-align:center;color:var(--gray-400);margin-top:.5rem;font-size:.85rem">Setting up payment…</p>
      </div>

      <!-- Error state -->
      <div id="errorState" style="display:none">
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:.5rem" onclick="location.href='shipments.html'">← Back</button>
      </div>

      <!-- Success state (shown after payment completes) -->
      <div id="successState" style="display:none" class="success-box">
        <div class="success-icon">✅</div>
        <div style="font-weight:800;font-size:1.3rem;color:var(--accent)">Payment Successful!</div>
        <div style="color:var(--gray-700);font-size:.875rem;margin:.5rem 0 1.25rem" id="successAmt"></div>
        <div style="font-size:.8rem;color:var(--gray-400);margin-bottom:1.25rem">The traveller will now pick up your parcel.</div>
        <button class="btn btn-primary btn-block" onclick="location.href='shipments.html'">View My Shipments →</button>
      </div>

      <div class="secure-badge">
        🔒 Secured by Cashfree Payments
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module">
  import { api, getUser, getToken } from './js/api.js';

  const user = getUser();
  if (!user || !getToken()) { window.location.href = 'login.html'; }

  const params     = new URLSearchParams(location.search);
  const shipmentId = params.get('shipmentId');
  if (!shipmentId) { window.location.href = 'shipments.html'; }

  let orderId = null;

  async function initPayment() {
    try {
      // 1. Load shipment details
      const shipment = await api.getShipment(shipmentId);
      const amtRs    = (shipment.totalAmount / 100).toFixed(2);

      document.getElementById('payAmount').textContent   = `₹${amtRs}`;
      document.getElementById('payDesc').textContent     = `${shipment.from} → ${shipment.to}`;
      document.getElementById('infoRoute').textContent   = `${shipment.from} → ${shipment.to}`;
      document.getElementById('infoParcel').textContent  = shipment.parcelDescription;
      document.getElementById('infoTraveller').textContent = shipment.travellerName;
      document.getElementById('infoPickup').textContent  = shipment.pickupSpot;
      document.getElementById('shipmentInfo').style.display = 'flex';

      // 2. Create Cashfree order from backend
      const order = await api.createOrder(shipmentId);
      orderId = order.orderId;

      document.getElementById('loadingState').style.display = 'none';

      // 3a. Mock mode — no real Cashfree credentials
      if (order.mock) {
        document.getElementById('cashfreeContainer').innerHTML = `
          <div style="background:#fff3cd;border:2px solid #ffc107;border-radius:10px;padding:1rem;text-align:center;margin-bottom:1rem">
            <div style="font-weight:700;color:#856404;margin-bottom:.5rem">🧪 Test / Demo Mode</div>
            <div style="font-size:.82rem;color:#856404;margin-bottom:1rem">Cashfree credentials not configured.<br>Click below to simulate a successful UPI payment.</div>
            <button class="btn btn-accent btn-block" onclick="mockPay()">📱 Simulate UPI Payment ₹${amtRs}</button>
          </div>`;
        return;
      }

      // 3b. Real Cashfree Checkout
      const cashfree = Cashfree({ mode: (window.CASHFREE_ENV === 'production') ? 'production' : 'sandbox' });
      const checkoutOptions = {
        paymentSessionId: order.paymentSessionId,
        returnUrl: `${location.origin}/app/payment-callback.html?shipmentId=${shipmentId}&orderId=${orderId}`,
        style: { backgroundColor: '#ffffff', color: '#074061', fontFamily: 'Poppins', fontSize: '14px', errorColor: '#e53935', theme: 'light' },
      };

      cashfree.checkout(checkoutOptions).then(result => {
        if (result.error)   showError(result.error.message);
        if (result.redirect) { /* redirect handled by returnUrl */ }
      });

    } catch (err) {
      document.getElementById('loadingState').style.display = 'none';
      showError(err.message);
    }
  }

  window.mockPay = async function() {
    try {
      document.getElementById('cashfreeContainer').innerHTML =
        '<div class="loader" style="margin:1rem 0"><div class="spinner"></div><p style="text-align:center;font-size:.85rem;color:var(--gray-400);margin-top:.5rem">Processing…</p></div>';
      await api.verifyPayment({ orderId, shipmentId });
      showSuccess();
    } catch(err) {
      showError(err.message);
    }
  };

  function showSuccess() {
    const amtEl = document.getElementById('payAmount').textContent;
    document.getElementById('cashfreeContainer').style.display = 'none';
    document.getElementById('shipmentInfo').style.display      = 'none';
    document.getElementById('successAmt').textContent          = `${amtEl} paid securely`;
    document.getElementById('successState').style.display      = 'block';
  }

  function showError(msg) {
    document.getElementById('cashfreeContainer').style.display = 'none';
    document.getElementById('errorMsg').textContent = msg || 'Payment failed. Please try again.';
    document.getElementById('errorState').style.display = 'block';
  }

  initPayment();
</script>
</body>
</html>

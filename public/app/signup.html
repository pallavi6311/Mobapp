<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerDrop – Sign Up</title>
  <link rel="icon" href="img/favicon/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="styles/app.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/my-logo-cropped.svg" alt="PeerDrop"/>
      <h1>PeerDrop</h1>
      <p>Create your account</p>
    </div>

    <p style="font-weight:700;font-size:.875rem;color:var(--gray-700);margin-bottom:.6rem">I want to…</p>
    <div class="role-selector">
      <div class="role-card" id="role-traveller" onclick="selectRole('traveller')">
        <div class="role-icon">✈️</div>
        <h4>Travel &amp; Earn</h4>
        <p>Post my trips and carry parcels for senders</p>
      </div>
      <div class="role-card" id="role-sender" onclick="selectRole('sender')">
        <div class="role-icon">📦</div>
        <h4>Send a Parcel</h4>
        <p>Find travellers going my way and ship affordably</p>
      </div>
    </div>

    <form id="signupForm" novalidate>
      <div style="display:flex;flex-direction:column;gap:.9rem;">
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="John Doe" required/>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 9876543210"/>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Minimum 6 characters" required/>
        </div>
        <div id="signupError" class="error-msg" style="display:none"></div>
        <button type="submit" class="btn btn-accent btn-block btn-lg" id="signupBtn">
          <span class="material-symbols-outlined" style="font-size:1.1rem">person_add</span>
          Create Account
        </button>
      </div>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--gray-400)">
      Already have an account? <a href="login.html" style="color:var(--primary);font-weight:700">Login</a>
    </p>
  </div>
</div>
<div id="toast-container"></div>

<script>
  // Store role on window so both script blocks can access it
  window.selectedRole = null;

  function selectRole(role) {
    window.selectedRole = role;
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('role-' + role).classList.add('selected');
  }

  // Auto-select from landing page link e.g. signup.html?role=traveller
  const roleParam = new URLSearchParams(location.search).get('role');
  if (roleParam) selectRole(roleParam);
</script>

<script type="module">
  import { api } from './js/api.js';

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errDiv = document.getElementById('signupError');
    const btn    = document.getElementById('signupBtn');

    if (!window.selectedRole) {
      errDiv.style.display = 'block';
      errDiv.textContent = 'Please select a role — Traveller or Sender';
      return;
    }

    const fullName = document.getElementById('fullName').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!fullName || !email || !password) {
      errDiv.style.display = 'block';
      errDiv.textContent = 'Please fill in all required fields';
      return;
    }
    if (password.length < 6) {
      errDiv.style.display = 'block';
      errDiv.textContent = 'Password must be at least 6 characters';
      return;
    }

    errDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    try {
      await api.register({ email, password, fullName, phone, role: window.selectedRole });
      window.location.href = 'login.html?registered=1';
    } catch (err) {
      errDiv.style.display = 'block';
      errDiv.textContent = err.message;
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.1rem">person_add</span> Create Account';
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerDrop – Login</title>
  <link rel="icon" href="img/favicon/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
  <link rel="stylesheet" href="styles/app.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/my-logo-cropped.svg" alt="PeerDrop"/>
      <h1>PeerDrop</h1>
      <p>Peer to Peer Delivery</p>
    </div>

    <form id="loginForm" novalidate>
      <div style="display:flex;flex-direction:column;gap:1rem;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required/>
        </div>
        <div id="loginError" class="error-msg" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
          <span class="material-symbols-outlined" style="font-size:1.1rem">login</span>
          Login
        </button>
      </div>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--gray-400)">
      Don't have an account? <a href="signup.html" style="color:var(--primary);font-weight:700">Sign Up</a>
    </p>
  </div>
</div>

<div id="toast-container"></div>

<script type="module">
  import { firebaseAuth, signInWithEmailAndPassword } from './js/firebase-config.js';
  import { api } from './js/api.js';

  const form    = document.getElementById('loginForm');
  const errDiv  = document.getElementById('loginError');
  const btn     = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const cred  = await signInWithEmailAndPassword(firebaseAuth, email, password);
      const token = await cred.user.getIdToken();
      localStorage.setItem('ll_token', token);

      // Fetch profile from our API (includes role)
      const profile = await api.getMe();
      localStorage.setItem('ll_user', JSON.stringify(profile));

      window.location.href = 'dashboard.html';
    } catch (err) {
      errDiv.style.display = 'block';
      errDiv.textContent = err.message.includes('wrong-password') || err.message.includes('invalid-credential')
        ? 'Invalid email or password'
        : err.message;
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.1rem">login</span> Login';
    }
  });
</script>
</body>
</html>
